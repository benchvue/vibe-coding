<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style><![CDATA[
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
.tb{fill:#1348a8;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
.to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
.sub{fill:#294b87;font:600 18px Arial,"Noto Sans KR",sans-serif}
.h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
.body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
.small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
.link{fill:#1f5fe0;font:700 19px Arial,"Noto Sans KR",sans-serif}
.num{fill:#fff;font:700 22px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.check{fill:#111827;font:700 23px Arial,"Noto Sans KR",sans-serif}
]]></style></defs>
<rect class="bg" width="1600" height="1000"/>

<!-- SELLO -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<path d="M48 57C62 30 92 28 103 58C87 52 72 48 48 57Z" fill="#1348a8"/>
<path d="M75 35V64M63 38L70 64M87 39L80 64M53 45L66 67M97 45L84 67" stroke="#fff" stroke-width="3"/>
<text x="118" y="58" class="tb">Sello (도장) 장소 &amp; 순서</text>
<text x="118" y="88" class="sub">카미노 여정의 마지막 도장 3곳</text>
<line x1="58" y1="145" x2="58" y2="790" stroke="#80a8ea" stroke-width="3" stroke-dasharray="6 10"/>

<circle cx="58" cy="150" r="24" fill="#1546a0"/><text x="58" y="150" class="num">1</text>
<text x="102" y="145" class="h">Arzúa</text>
<text x="102" y="179" class="sub">(아르수아)</text>
<text x="102" y="213" class="body">순례자 여정의 마지막</text>
<text x="102" y="241" class="body">작은 마을.</text>

<circle cx="58" cy="380" r="24" fill="#1546a0"/><text x="58" y="380" class="num">2</text>
<text x="102" y="375" class="h">O Pedrouzo</text>
<text x="102" y="409" class="sub">(오 페드로우소)</text>
<text x="102" y="443" class="body">순례자들의 마지막</text>
<text x="102" y="471" class="body">하룻밤 마을.</text>

<circle cx="58" cy="610" r="24" fill="#1546a0"/><text x="58" y="610" class="num">3</text>
<text x="102" y="605" class="h">Santiago de Compostela</text>
<text x="102" y="639" class="sub">(산티아고 데 콤포스텔라)</text>
<text x="102" y="673" class="body">대성당에서 순례 완주</text>
<text x="102" y="701" class="body">증서(Credencial) 수령.</text>

<rect x="44" y="790" width="332" height="150" rx="16" fill="#edf4ff" stroke="#c9daf7"/>
<text x="64" y="825" class="h" fill="#1348a8">Day 13 Sello 핵심</text>
<text x="64" y="860" class="body">Arzúa → O Pedrouzo → Santiago</text>
<text x="64" y="892" class="small">카미노 프란세스 여정의 마지막 날!</text>

<!-- MUST SEE -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<circle cx="456" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="482" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="465" y="41" width="9" height="16" rx="3" fill="#198038"/>
<text x="505" y="58" class="tg">오늘의 명소 (Must See)</text>

<rect x="444" y="110" width="332" height="210" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="150" class="h">Monte do Gozo</text>
<text x="466" y="180" class="h">(기쁨의 언덕)</text>
<text x="466" y="218" class="body">산티아고가 눈앞에 보이는</text>
<text x="466" y="248" class="body">순례자들의 마지막 언덕.</text>

<rect x="444" y="345" width="332" height="210" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="385" class="h">산티아고 데 콤포스텔라</text>
<text x="466" y="415" class="h">대성당 (Cathedral)</text>
<text x="466" y="453" class="body">성 야고보의 무덤이 있는</text>
<text x="466" y="483" class="body">세계적인 순례지.</text>

<rect x="444" y="580" width="332" height="210" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="620" class="h">Plaza do Obradoiro</text>
<text x="466" y="658" class="body">대성당 앞 광장.</text>
<text x="466" y="688" class="body">순례의 완성 순간을 맞이하는 곳.</text>

<rect x="444" y="815" width="332" height="125" rx="16" fill="#edf8ef" stroke="#cfe8d4"/>
<text x="466" y="853" class="h" fill="#198038">마지막 Must See</text>
<text x="466" y="890" class="body">Monte do Gozo → Cathedral → Obradoiro</text>

<!-- LUNCH -->
<rect class="card" x="820" y="20" width="380" height="960" rx="20"/>
<path d="M853 34V60M846 34V47M860 34V47M846 47H860M853 60V77" stroke="#e04d00" stroke-width="5"/>
<path d="M878 34C890 46 890 59 878 69V77" fill="none" stroke="#e04d00" stroke-width="5"/>
<text x="905" y="58" class="to">점심 맛집 추천</text>

<rect x="844" y="110" width="332" height="350" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="1010" y="155" text-anchor="middle" class="h">O Pino – A Taberna</text>
<text x="1010" y="185" text-anchor="middle" class="h">(오 페드로우소 인근)</text>
<line x1="872" y1="215" x2="1148" y2="215" stroke="#ead3b4" stroke-width="2"/>
<text x="874" y="265" class="check">✓</text><text x="908" y="265" class="body">갈리시아식 스테이크, 문어 요리</text>
<text x="874" y="315" class="check">✓</text><text x="908" y="315" class="body">주소: Rúa Progreso, O Pedrouzo</text>
<text x="874" y="385" font-size="30">●</text><text x="916" y="385" class="link">Google Maps</text>

<rect x="844" y="490" width="332" height="350" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="1010" y="535" text-anchor="middle" class="h">Casa Galilega</text>
<text x="1010" y="565" text-anchor="middle" class="h">(Lavacolla / 라바꼬야)</text>
<line x1="872" y1="595" x2="1148" y2="595" stroke="#ead3b4" stroke-width="2"/>
<text x="874" y="645" class="check">✓</text><text x="908" y="645" class="body">파에야, 생선 요리</text>
<text x="874" y="695" class="check">✓</text><text x="908" y="695" class="body">주소: Lavacolla, A Coruña</text>
<text x="874" y="765" font-size="30">●</text><text x="916" y="765" class="link">Google Maps</text>

<rect x="844" y="870" width="332" height="70" rx="16" fill="#fffdf9" stroke="#f1d8b7"/>
<text x="868" y="912" class="small">마지막 구간이므로 가볍게 먹고 Santiago로!</text>

<!-- DINNER -->
<rect class="card" x="1220" y="20" width="360" height="960" rx="20"/>
<path d="M1253 34V60M1246 34V47M1260 34V47M1246 47H1260M1253 60V77" stroke="#c40016" stroke-width="5"/>
<path d="M1278 34C1290 46 1290 59 1278 69V77" fill="none" stroke="#c40016" stroke-width="5"/>
<text x="1303" y="58" class="tr">저녁 맛집 추천</text>

<rect x="1244" y="110" width="312" height="350" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1400" y="155" text-anchor="middle" class="h">San Francisco</text>
<text x="1400" y="185" text-anchor="middle" class="h">(산티아고 구시가지)</text>
<line x1="1270" y1="215" x2="1530" y2="215" stroke="#efc8cd" stroke-width="2"/>
<text x="1272" y="265" class="check">✓</text><text x="1306" y="265" class="body">갈리시아 해산물, 전통 요리</text>
<text x="1272" y="315" class="check">✓</text><text x="1306" y="315" class="body">주소: Rúa do Franco, Santiago</text>
<text x="1272" y="385" font-size="30">●</text><text x="1314" y="385" class="link">Google Maps</text>

<rect x="1244" y="490" width="312" height="350" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1400" y="535" text-anchor="middle" class="h">O Quitapenas</text>
<text x="1400" y="565" text-anchor="middle" class="h">(산티아고)</text>
<line x1="1270" y1="595" x2="1530" y2="595" stroke="#efc8cd" stroke-width="2"/>
<text x="1272" y="645" class="check">✓</text><text x="1306" y="645" class="body">타파스, 현지 와인</text>
<text x="1272" y="695" class="check">✓</text><text x="1306" y="695" class="body">주소: Rúa das Hortas, Santiago</text>
<text x="1272" y="765" font-size="30">●</text><text x="1314" y="765" class="link">Google Maps</text>

<rect x="1244" y="870" width="312" height="70" rx="16" fill="#fffafb" stroke="#efcbd0"/>
<text x="1268" y="912" class="small">완주를 축하하며 갈리시아 음식으로 마무리!</text>
</svg>