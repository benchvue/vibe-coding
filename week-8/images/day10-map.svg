<text x="874" y="635" class="check">✓</text><text x="908" y="635" class="body">순례자들에게 인기 있는 레스토랑</text>
<text x="874" y="680" class="check">✓</text><text x="908" y="680" class="body">추천 메뉴: 맥주, 샐러드, 파스타, 현지요리</text>
<text x="874" y="725" class="check">✓</text><text x="908" y="725" class="body">가격대: €12~€20</text>
<text x="874" y="770" class="check">✓</text><text x="908" y="770" class="body">주소: Av. España, 21, Ponferrada</text>
<text x="874" y="820" font-size="30">●</text><text x="916" y="820" class="link">Google Maps</text>

<rect x="844" y="875" width="332" height="65" rx="16" fill="#fffdf9" stroke="#f1d8b7"/>
