<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style><![CDATA[
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
.tb{fill:#1348a8;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
.to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
.sub{fill:#294b87;font:600 18px Arial,"Noto Sans KR",sans-serif}
.h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
.body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
.small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
.link{fill:#1f5fe0;font:700 19px Arial,"Noto Sans KR",sans-serif}
.num{fill:#fff;font:700 22px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.check{fill:#111827;font:700 23px Arial,"Noto Sans KR",sans-serif}
]]></style></defs>

<rect class="bg" width="1600" height="1000"/>

<!-- COLUMN 1: SELLO -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<path d="M48 57C62 30 92 28 103 58C87 52 72 48 48 57Z" fill="#1348a8"/>
<path d="M75 35V64M63 38L70 64M87 39L80 64M53 45L66 67M97 45L84 67" stroke="#fff" stroke-width="3"/>
<text x="118" y="58" class="tb">Sello (도장) 장소 &amp; 순서</text>
<text x="118" y="88" class="sub">카미노 여권에 찍어야 할 도장 5곳</text>

<line x1="58" y1="135" x2="58" y2="815" stroke="#80a8ea" stroke-width="3" stroke-dasharray="6 10"/>

<circle cx="58" cy="140" r="21" fill="#1546a0"/><text x="58" y="140" class="num">1</text>
<text x="102" y="135" class="h">Cruz de Ferro (철십자가)</text>
<text x="102" y="168" class="sub">(중간 도장)</text>
<text x="102" y="201" class="body">카미노의 상징! 순례자들이 돌을 놓고</text>
<text x="102" y="228" class="body">기도하는 최고 명소.</text>

<circle cx="58" cy="290" r="21" fill="#1546a0"/><text x="58" y="290" class="num">2</text>
<text x="102" y="285" class="h">Molinaseca 교회</text>
<text x="102" y="318" class="sub">(중간 도장)</text>
<text x="102" y="351" class="body">아름다운 중세 마을에서 도장 받기.</text>

<circle cx="58" cy="440" r="21" fill="#1546a0"/><text x="58" y="440" class="num">3</text>
<text x="102" y="435" class="h">Ponferrada 템플 기사단 성</text>
<text x="102" y="468" class="sub">(중간 도장)</text>
<text x="102" y="501" class="body">Templar Castle 내 Pilgrim Office.</text>

<circle cx="58" cy="590" r="21" fill="#1546a0"/><text x="58" y="590" class="num">4</text>
<text x="102" y="585" class="h">Cacabelos 교회</text>
<text x="102" y="618" class="sub">(중간 도장)</text>
<text x="102" y="651" class="body">Río Cúa 강변의 와이너리 마을.</text>

<circle cx="58" cy="740" r="21" fill="#1546a0"/><text x="58" y="740" class="num">5</text>
<text x="102" y="735" class="h">Vega de Valcarce</text>
<text x="102" y="768" class="h">알베르게/숙소</text>
<text x="102" y="801" class="sub">(도착 도장)</text>
<text x="102" y="834" class="body">마지막 도장을 받으세요.</text>

<rect x="44" y="865" width="332" height="75" rx="16" fill="#edf4ff" stroke="#c9daf7"/>
<text x="64" y="897" class="h" fill="#1348a8">Day 10 Sello 핵심</text>
<text x="64" y="925" class="small">Cruz de Ferro → Molinaseca → Ponferrada → Cacabelos → Vega</text>

<!-- COLUMN 2: MUST SEE -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<circle cx="456" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="482" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="465" y="41" width="9" height="16" rx="3" fill="#198038"/>
<text x="505" y="58" class="tg">오늘의 명소 (Must See)</text>

<rect x="444" y="110" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="150" class="h">Cruz de Ferro (철십자가)</text>
<text x="466" y="188" class="body">1,504m의 카미노 최고 지점.</text>
<text x="466" y="218" class="body">돌을 올려놓고 소원을 빌어보세요.</text>

<rect x="444" y="305" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="345" class="h">Molinaseca 마을</text>
<text x="466" y="383" class="body">중세 다리와 돌길이 아름다운</text>
<text x="466" y="413" class="body">'카미노의 보석'. 테라스에서</text>
<text x="466" y="443" class="body">잠시 휴식을 즐기기에 좋아요.</text>

<rect x="444" y="500" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="540" class="h">Ponferrada 템플 기사단 성</text>
<text x="466" y="578" class="body">12세기 십자군 기사단(Templar)</text>
<text x="466" y="608" class="body">이 지은 웅장한 성. 박물관 관람</text>
<text x="466" y="638" class="body">추천!</text>

<rect x="444" y="695" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="735" class="h">Bierzo 와인 지역</text>
<text x="466" y="773" class="body">Cacabelos 주변은 스페인</text>
<text x="466" y="803" class="body">유명 와인 산지 Bierzo의 중심지.</text>
<text x="466" y="833" class="body">포도밭 풍경이 아름답습니다.</text>

<rect x="444" y="890" width="332" height="50" rx="16" fill="#edf8ef" stroke="#cfe8d4"/>
<text x="466" y="922" class="small">Cruz de Ferro → Molinaseca → Ponferrada → Bierzo</text>

