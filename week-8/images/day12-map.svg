<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <style><![CDATA[
    .bg{fill:#f7f9fc}
    .card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
    .tb{fill:#1348a8;font:700 29px Arial,"Noto Sans KR",sans-serif}
    .tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
    .to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
    .tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
    .sub{fill:#294b87;font:600 18px Arial,"Noto Sans KR",sans-serif}
    .h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
    .body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
    .small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
    .link{fill:#1f5fe0;font:700 19px Arial,"Noto Sans KR",sans-serif}
    .num{fill:#fff;font:700 22px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
    .check{fill:#111827;font:700 23px Arial,"Noto Sans KR",sans-serif}
    .rating{fill:#d97706;font:700 18px Arial,"Noto Sans KR",sans-serif}
  ]]></style>
</defs>

<rect class="bg" width="1600" height="1000"/>

<!-- COLUMN 1 : SELLO -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<path d="M48 57C62 30 92 28 103 58C87 52 72 48 48 57Z" fill="#1348a8"/>
<path d="M75 35V64M63 38L70 64M87 39L80 64M53 45L66 67M97 45L84 67" stroke="#fff" stroke-width="3"/>
<text x="118" y="58" class="tb">Sello (도장) 장소 &amp; 순서</text>
<text x="118" y="88" class="sub">카미노 여권에 찍어야 할 도장 4곳</text>

<line x1="58" y1="140" x2="58" y2="805" stroke="#80a8ea" stroke-width="3" stroke-dasharray="6 10"/>

<circle cx="58" cy="145" r="22" fill="#1546a0"/><text x="58" y="145" class="num">1</text>
<text x="102" y="140" class="h">Portomarín (포르토마린)</text>
<text x="102" y="174" class="body">• 산 니콜라스 교회 도장</text>
<text x="102" y="204" class="body">• 현재 마을 잔교에서도</text>
<text x="102" y="232" class="body">  도장 가능</text>

<circle cx="58" cy="325" r="22" fill="#1546a0"/><text x="58" y="325" class="num">2</text>
<text x="102" y="320" class="h">Palas de Rei (팔라스 데 레이)</text>
<text x="102" y="354" class="body">• 교구 교회 도장</text>
<text x="102" y="384" class="body">• 마을 바 · 카페 여러 곳</text>

<circle cx="58" cy="505" r="22" fill="#1546a0"/><text x="58" y="505" class="num">3</text>
<text x="102" y="500" class="h">Melide (멜리데)</text>
<text x="102" y="534" class="body">• 산타 마리아 교회 도장</text>
<text x="102" y="564" class="body">• 유명한 뿔포(문어 요리) 마을</text>

<circle cx="58" cy="685" r="22" fill="#1546a0"/><text x="58" y="685" class="num">4</text>
<text x="102" y="680" class="h">Arzúa (아르수아)</text>
<text x="102" y="714" class="body">• 산티아고까지 약 40km 남김</text>
<text x="102" y="744" class="body">• 중요 거점 마을 – 도장 필수</text>

<rect x="44" y="825" width="332" height="115" rx="16" fill="#edf4ff" stroke="#c9daf7"/>
<text x="64" y="862" class="h" fill="#1348a8">Day 12 Sello 핵심</text>
<text x="64" y="898" class="body">Portomarín → Palas de Rei</text>
<text x="64" y="926" class="small">→ Melide → Arzúa, 총 4곳</text>

<!-- COLUMN 2 : MUST SEE -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<circle cx="456" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="482" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="465" y="41" width="9" height="16" rx="3" fill="#198038"/>
<text x="505" y="58" class="tg">오늘의 명소 (Must See)</text>

<rect x="444" y="105" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="145" class="h">Portomarín (포르토마린)</text>
<text x="466" y="183" class="body">• 미뇨 강 위에 새로 지은 마을</text>
<text x="466" y="213" class="body">• 중세 교회와 강변 풍경이 아름다움</text>

<rect x="444" y="300" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="340" class="h">Palas de Rei (팔라스 데 레이)</text>
<text x="466" y="378" class="body">• 조용하고 평화로운 전통 마을</text>
<text x="466" y="408" class="body">• 카미노의 중요한 중간 거점</text>

<rect x="444" y="495" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="535" class="h">Melide (멜리데)</text>
<text x="466" y="573" class="body">• 갈리시아 전통 문어 요리(뿔포)</text>
<text x="466" y="603" class="body">• 순례자 거리 분위기 최고</text>

<rect x="444" y="690" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="730" class="h">Arzúa (아르수아)</text>
<text x="466" y="768" class="body">• 치즈와 카페로 유명한 마을</text>
<text x="466" y="798" class="body">• 순례자들이 많이 머무는 휴식지</text>

<rect x="444" y="885" width="332" height="55" rx="16" fill="#edf8ef" stroke="#cfe8d4"/>
<text x="466" y="920" class="small">Portomarín → Palas de Rei → Melide → Arzúa</text>

<!-- COLUMN 3 : LUNCH -->
<rect class="card" x="820" y="20" width="380" height="960" rx="20"/>
<path d="M853 34V60M846 34V47M860 34V47M846 47H860M853 60V77" stroke="#e04d00" stroke-width="5"/>
<path d="M878 34C890 46 890 59 878 69V77" fill="none" stroke="#e04d00" stroke-width="5"/>
<text x="905" y="58" class="to">점심 맛집 추천</text>

<rect x="844" y="100" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="140" class="h">A Parada das Bestas</text>
<text x="866" y="168" class="h">(Portomarín)</text>
<text x="1124" y="140" class="rating">★ 4.5</text>
<text x="866" y="210" class="body">• 갈리시아 가정식, 타파스</text>
<text x="866" y="240" class="body">• 가격: €12~18</text>
<text x="866" y="290" font-size="30">●</text><text x="908" y="290" class="link">Google Maps</text>

<rect x="844" y="375" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="415" class="h">Mesón O Camiño</text>
<text x="866" y="443" class="h">(Melide)</text>
<text x="1124" y="415" class="rating">★ 4.6</text>
<text x="866" y="485" class="body">• 유명한 뿔포(문어), 볶음 문어</text>
<text x="866" y="515" class="body">• 가격: €12~20</text>
<text x="866" y="565" font-size="30">●</text><text x="908" y="565" class="link">Google Maps</text>

<rect x="844" y="650" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="690" class="h">O Furancho de Arzúa</text>
<text x="866" y="718" class="h">(Arzúa)</text>
<text x="1124" y="690" class="rating">★ 4.5</text>
<text x="866" y="760" class="body">• 갈리시아 요리, 현지 와인</text>
<text x="866" y="790" class="body">• 가격: €12~22</text>
<text x="866" y="840" font-size="30">●</text><text x="908" y="840" class="link">Google Maps</text>

<!-- COLUMN 4 : DINNER -->
<rect class="card" x="1220" y="20" width="360" height="960" rx="20"/>
<path d="M1253 34V60M1246 34V47M1260 34V47M1246 47H1260M1253 60V77" stroke="#c40016" stroke-width="5"/>
<path d="M1278 34C1290 46 1290 59 1278 69V77" fill="none" stroke="#c40016" stroke-width="5"/>
<text x="1303" y="58" class="tr">저녁 맛집 추천</text>

<rect x="1244" y="100" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="140" class="h">Restaurante Villa Jardín</text>
<text x="1266" y="168" class="h">(Sarria)</text>
<text x="1504" y="140" class="rating">★ 4.6</text>
<text x="1266" y="210" class="body">• 현대적 분위기, 지역 요리</text>
<text x="1266" y="240" class="body">• 가격: €15~25</text>
<text x="1266" y="290" font-size="30">●</text><text x="1308" y="290" class="link">Google Maps</text>

<rect x="1244" y="375" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="415" class="h">Mesón A Curva</text>
<text x="1266" y="443" class="h">(Melide)</text>
<text x="1504" y="415" class="rating">★ 4.5</text>
<text x="1266" y="485" class="body">• 뿔포, 갈리시아 전통 요리</text>
<text x="1266" y="515" class="body">• 가격: €15~25</text>
<text x="1266" y="565" font-size="30">●</text><text x="1308" y="565" class="link">Google Maps</text>

<rect x="1244" y="650" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="690" class="h">Casa Teodora</text>
<text x="1266" y="718" class="h">(Arzúa)</text>
<text x="1504" y="690" class="rating">★ 4.7</text>
<text x="1266" y="760" class="body">• 숨은 맛집, 타파스 &amp; 고기 요리</text>
<text x="1266" y="790" class="body">• 가격: €15~28</text>
<text x="1266" y="840" font-size="30">●</text><text x="1308" y="840" class="link">Google Maps</text>
