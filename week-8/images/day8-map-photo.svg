<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style><![CDATA[
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
.tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
.to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
.h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
.body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
.small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
.num{fill:#fff;font:700 21px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.link{fill:#1f5fe0;font:700 18px Arial,"Noto Sans KR",sans-serif}
.rating{fill:#d97706;font:700 18px Arial,"Noto Sans KR",sans-serif}
.rest{fill:#5b21b6;font:700 24px Arial,"Noto Sans KR",sans-serif}
]]></style></defs>

<rect class="bg" width="1600" height="1000"/>

<!-- COLUMN 1 : MUST SEE 1-4 -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<circle cx="55" cy="58" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="81" cy="58" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="64" y="42" width="9" height="16" rx="3" fill="#198038"/>
<text x="105" y="59" class="tg">오늘의 명소 (Must See)</text>

<rect x="44" y="105" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="68" cy="135" r="18" fill="#198038"/><text x="68" y="135" class="num">1</text>
<text x="98" y="140" class="h">레온 대성당</text>
<text x="98" y="168" class="small">(Catedral de León)</text>
<text x="62" y="205" class="body">• 스페인 3대 고딕 성당 중 하나</text>
<text x="62" y="235" class="body">• 스테인드글라스가 특히 아름다움</text>
<text x="62" y="265" class="small">운영 10:00~18:30 / 입장료 약 €7</text>

<rect x="44" y="310" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="68" cy="340" r="18" fill="#198038"/><text x="68" y="340" class="num">2</text>
<text x="98" y="345" class="h">산 이시도로 성당</text>
<text x="98" y="373" class="small">(Basílica de San Isidoro)</text>
<text x="62" y="410" class="body">• 레온 왕국의 왕들이 묻힌 곳</text>
<text x="62" y="440" class="body">• 로마네스크 예술의 걸작</text>
<text x="62" y="470" class="small">운영 10:00~14:00, 16:00~19:00</text>

<rect x="44" y="515" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="68" cy="545" r="18" fill="#198038"/><text x="68" y="545" class="num">3</text>
<text x="98" y="550" class="h">구엘/보티네스 저택</text>
<text x="98" y="578" class="small">(Casa Botines)</text>
<text x="62" y="615" class="body">• 가우디가 설계한 독특한 건축물</text>
<text x="62" y="645" class="body">• 내부 박물관도 볼 만함</text>
<text x="62" y="675" class="small">운영 10:00~19:00 / 입장료 약 €7</text>

<rect x="44" y="720" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="68" cy="750" r="18" fill="#198038"/><text x="68" y="750" class="num">4</text>
<text x="98" y="755" class="h">산 마르코스 수도원</text>
<text x="98" y="783" class="small">(Parador de San Marcos)</text>
<text x="62" y="820" class="body">• 르네상스 건축의 보석</text>
<text x="62" y="850" class="body">• 현재는 파라도르 호텔로 운영</text>
<text x="62" y="880" class="small">내부 일부와 외부 건물 관람 가능</text>

<!-- COLUMN 2 : MUST SEE 5-7 + REST DAY -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<text x="448" y="58" class="rest">Day 8 · León 휴식일 — No Bike</text>

<rect x="444" y="105" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="468" cy="135" r="18" fill="#198038"/><text x="468" y="135" class="num">5</text>
<text x="498" y="140" class="h">레온 중앙시장</text>
<text x="498" y="168" class="small">(Mercado de Abastos)</text>
<text x="462" y="205" class="body">• 현지 식재료와 타파스 맛보기</text>
<text x="462" y="235" class="body">• 신선한 과일, 치즈, 하몽 추천</text>
<text x="462" y="265" class="small">운영 약 08:30~14:30</text>

<rect x="444" y="310" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="468" cy="340" r="18" fill="#198038"/><text x="468" y="340" class="num">6</text>
<text x="498" y="345" class="h">산티아고 문</text>
<text x="498" y="373" class="small">(Puerta de Santiago)</text>
<text x="462" y="410" class="body">• 중세 성벽의 유일한 원형 문</text>
<text x="462" y="440" class="body">• 순례자들이 도시에 들어오던 길</text>

<rect x="444" y="515" width="332" height="185" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<circle cx="468" cy="545" r="18" fill="#198038"/><text x="468" y="545" class="num">7</text>
<text x="498" y="550" class="h">인류 진화 박물관</text>
<text x="498" y="578" class="small">(MUSAC)</text>
<text x="462" y="615" class="body">• 현대적이고 흥미로운 전시</text>
<text x="462" y="645" class="body">• 아이와 함께 가기도 좋음</text>
<text x="462" y="675" class="small">운영 약 10:00~20:00 / 월요일 휴무</text>

<rect x="444" y="720" width="332" height="185" rx="16" fill="#f3efff" stroke="#d9ccff"/>
<text x="466" y="760" class="h" fill="#5b21b6">휴식일 추천 흐름</text>
<text x="466" y="802" class="body">오전: 대성당 → San Isidoro</text>
<text x="466" y="835" class="body">점심: 중앙시장 또는 구시가지</text>
<text x="466" y="868" class="body">오후: Casa Botines → San Marcos</text>
<text x="466" y="901" class="small">자전거는 쉬고 도보 위주로 천천히.</text>

<!-- COLUMN 3 : LUNCH -->
<rect class="card" x="820" y="20" width="380" height="960" rx="20"/>
<path d="M853 34V60M846 34V47M860 34V47M846 47H860M853 60V77" stroke="#e04d00" stroke-width="5"/>
<path d="M878 34C890 46 890 59 878 69V77" fill="none" stroke="#e04d00" stroke-width="5"/>
<text x="905" y="58" class="to">점심 맛집 추천</text>

<rect x="844" y="100" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="140" class="h">Casa Marcial</text>
<text x="866" y="168" class="small">미슐랭 2스타 셰프 레스토랑</text>
<text x="866" y="210" class="body">• 레온 대표 미식 레스토랑</text>
<text x="866" y="240" class="body">• 추천: Menú Degustación</text>
<text x="866" y="270" class="body">• 가격대: €55~€85</text>
<text x="866" y="300" class="small">Ctra. La Magdalena, km. 0.5</text>
<text x="866" y="330" class="link">Google Maps</text>

<rect x="844" y="375" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="415" class="h">El Capricho</text>
<text x="866" y="455" class="body">• 현지인에게 인기 많은 타파스 바</text>
<text x="866" y="485" class="body">• 신선한 재료와 창의적인 요리</text>
<text x="866" y="515" class="body">• 추천: 타파스 모둠, 와인</text>
<text x="866" y="545" class="body">• 가격대: €15~€25</text>
<text x="866" y="575" class="small">Calle Paloma, 9</text>
<text x="866" y="605" class="link">Google Maps</text>

<rect x="844" y="650" width="332" height="250" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="866" y="690" class="h">Bodega Regia</text>
<text x="866" y="730" class="body">• 전통 레온 요리를 맛보기 좋은 곳</text>
<text x="866" y="760" class="body">• 합리적인 가격과 푸짐한 양</text>
<text x="866" y="790" class="body">• 추천: 모르시야, 렌즈 스튜</text>
<text x="866" y="820" class="body">• 가격대: €12~€20</text>
<text x="866" y="850" class="small">Calle Lucas de Tuy, 7</text>
<text x="866" y="880" class="link">Google Maps</text>

<!-- COLUMN 4 : DINNER -->
<rect class="card" x="1220" y="20" width="360" height="960" rx="20"/>
<path d="M1253 34V60M1246 34V47M1260 34V47M1246 47H1260M1253 60V77" stroke="#c40016" stroke-width="5"/>
<path d="M1278 34C1290 46 1290 59 1278 69V77" fill="none" stroke="#c40016" stroke-width="5"/>
<text x="1303" y="58" class="tr">저녁 맛집 추천</text>

<rect x="1244" y="100" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="140" class="h">Confitería Torres</text>
<text x="1266" y="168" class="small">100년 전통의 레온 명물 레스토랑</text>
<text x="1266" y="210" class="body">• 전통 요리와 디저트가 유명</text>
<text x="1266" y="240" class="body">• 추천: 코시도, 마라게고, 크렘</text>
<text x="1266" y="270" class="body">• 가격대: €20~€30</text>
<text x="1266" y="300" class="small">Calle Ancha, 2</text>
<text x="1266" y="330" class="link">Google Maps</text>

<rect x="1244" y="375" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="415" class="h">La Trastienda del 13</text>
<text x="1266" y="455" class="body">• 분위기 좋은 타파스 &amp; 와인 바</text>
<text x="1266" y="485" class="body">• 와인과 타파스의 완벽한 조화</text>
<text x="1266" y="515" class="body">• 추천: 미비리코, 크로케타스</text>
<text x="1266" y="545" class="body">• 가격대: €15~€25</text>
<text x="1266" y="575" class="small">Calle del Sacramento, 13</text>
<text x="1266" y="605" class="link">Google Maps</text>

<rect x="1244" y="650" width="312" height="250" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1266" y="690" class="h">La Cocina de Ramón</text>
<text x="1266" y="730" class="body">• 현대적인 감각의 전통 요리</text>
<text x="1266" y="760" class="body">• 서비스와 맛 모두 만족도 높음</text>
<text x="1266" y="790" class="body">• 추천: 메뉴 델 디아</text>
<text x="1266" y="820" class="body">• 가격대: €25~€35</text>
<text x="1266" y="850" class="small">Calle Cervantes, 5</text>
<text x="1266" y="880" class="link">Google Maps</text>
</svg>