<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style><![CDATA[
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
.tb{fill:#1348a8;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
.to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
.sub{fill:#294b87;font:600 18px Arial,"Noto Sans KR",sans-serif}
.h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
.body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
.small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
.link{fill:#1f5fe0;font:700 19px Arial,"Noto Sans KR",sans-serif}
.num{fill:#fff;font:700 22px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.check{fill:#111827;font:700 23px Arial,"Noto Sans KR",sans-serif}
]]></style></defs>
<rect class="bg" width="1600" height="1000"/>

<!-- SELLO -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<path d="M48 57C62 30 92 28 103 58C87 52 72 48 48 57Z" fill="#1348a8"/>
<path d="M75 35V64M63 38L70 64M87 39L80 64M53 45L66 67M97 45L84 67" stroke="#fff" stroke-width="3"/>
<text x="118" y="58" class="tb">Sello (도장) 장소 &amp; 순서</text>
<text x="118" y="88" class="sub">카미노 여권에 찍어야 할 도장 3곳</text>
<line x1="58" y1="145" x2="58" y2="790" stroke="#80a8ea" stroke-width="3" stroke-dasharray="6 10"/>

<circle cx="58" cy="150" r="24" fill="#1546a0"/><text x="58" y="150" class="num">1</text>
<text x="102" y="145" class="h">San Martín del Camino 교회</text>
<text x="102" y="179" class="sub">(중간 도장)</text>
<text x="102" y="213" class="body">Iglesia de San Martín에서 도장 받기.</text>
<text x="102" y="241" class="body">레온에서 첫 번째 마을!</text>

<circle cx="58" cy="380" r="24" fill="#1546a0"/><text x="58" y="380" class="num">2</text>
<text x="102" y="375" class="h">Astorga 대성당</text>
<text x="102" y="409" class="sub">(중간 도장)</text>
<text x="102" y="443" class="body">웅장한 고딕 성당에서 도장 받기.</text>
<text x="102" y="471" class="body">가우디가 설계한 주교궁도 놓치지 마세요!</text>

<circle cx="58" cy="610" r="24" fill="#1546a0"/><text x="58" y="610" class="num">3</text>
<text x="102" y="605" class="h">Rabanal del Camino 수도원/숙소</text>
<text x="102" y="639" class="sub">(도착 도장)</text>
<text x="102" y="673" class="body">숙소 도착 후 마지막 도장을</text>
<text x="102" y="701" class="body">받으세요.</text>

<rect x="44" y="790" width="332" height="150" rx="16" fill="#edf4ff" stroke="#c9daf7"/>
<text x="64" y="825" class="h" fill="#1348a8">Day 9 Sello 핵심</text>
<text x="64" y="860" class="body">San Martín → Astorga → Rabanal</text>
<text x="64" y="892" class="small">중간 2곳 + 도착 1곳, 총 3곳.</text>

<!-- MUST SEE -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<circle cx="456" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="482" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="465" y="41" width="9" height="16" rx="3" fill="#198038"/>
<text x="505" y="58" class="tg">오늘의 명소 (Must See)</text>

<rect x="444" y="110" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="150" class="h">아스토르가 대성당</text>
<text x="466" y="188" class="body">산티아고 순례길의 아름다운</text>
<text x="466" y="218" class="body">고딕 성당. 화려한 스테인드글라스</text>
<text x="466" y="248" class="body">와 조각이 인상적입니다.</text>

<rect x="444" y="305" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="345" class="h">가우디 주교궁 (Palacio Episcopal)</text>
<text x="466" y="383" class="body">안토니 가우디가 설계한</text>
<text x="466" y="413" class="body">독특한 건축물. 동화 속 성을</text>
<text x="466" y="443" class="body">연상케 해요!</text>

<rect x="444" y="500" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="540" class="h">폰세바돈 (Foncebadón)</text>
<text x="466" y="578" class="body">1,430m의 고개 마을.</text>
<text x="466" y="608" class="body">십자가와 순례자의 동상이 있는</text>
<text x="466" y="638" class="body">전망 포인트!</text>

<rect x="444" y="695" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="735" class="h">Rabanal del Camino</text>
<text x="466" y="773" class="body">산길로 들어가기 전 만나는</text>
<text x="466" y="803" class="body">전통적인 순례자 마을.</text>
<text x="466" y="833" class="body">조용히 하루를 마무리하기 좋아요.</text>

<rect x="444" y="890" width="332" height="50" rx="16" fill="#edf8ef" stroke="#cfe8d4"/>
<text x="466" y="922" class="small">Astorga → Gaudí → Foncebadón → Rabanal</text>

<!-- LUNCH -->
<rect class="card" x="820" y="20" width="380" height="960" rx="20"/>
<path d="M853 34V60M846 34V47M860 34V47M846 47H860M853 60V77" stroke="#e04d00" stroke-width="5"/>
<path d="M878 34C890 46 890 59 878 69V77" fill="none" stroke="#e04d00" stroke-width="5"/>
<text x="905" y="58" class="to">점심 맛집 추천</text>

<rect x="844" y="110" width="332" height="535" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="1010" y="160" text-anchor="middle" class="h">Restaurante Serrano</text>
<text x="1010" y="190" text-anchor="middle" class="h">(Astorga)</text>
<line x1="872" y1="220" x2="1148" y2="220" stroke="#ead3b4" stroke-width="2"/>
<text x="874" y="275" class="check">✓</text><text x="908" y="275" class="body">현지인에게 인기 있는 전통 레스토랑</text>
<text x="874" y="325" class="check">✓</text><text x="908" y="325" class="body">메뉴 델 디아(Menu del Día) 가성비 굿</text>
<text x="874" y="375" class="check">✓</text><text x="908" y="375" class="body">추천 메뉴: 코치니요(새끼돼지 구이),</text>
<text x="908" y="405" class="body">렌틸콩 요리</text>
<text x="874" y="455" class="check">✓</text><text x="908" y="455" class="body">주소: C. Serrano, 11, Astorga</text>
<text x="874" y="515" font-size="30">●</text><text x="916" y="515" class="link">Google Maps</text>

<rect x="844" y="675" width="332" height="265" rx="16" fill="#fffdf9" stroke="#f1d8b7"/>
<text x="868" y="715" class="h" fill="#d85a00">점심 팁</text>
<text x="868" y="755" class="body">• Astorga 관광 후 산악 구간에</text>
<text x="868" y="785" class="body">  들어가기 전에 충분히 식사하세요.</text>
<text x="868" y="835" class="body">• 물과 간식을 보충하고</text>
<text x="868" y="865" class="body">  Rabanal까지 여유 있게 이동하세요.</text>

<!-- DINNER -->
<rect class="card" x="1220" y="20" width="360" height="960" rx="20"/>
<path d="M1253 34V60M1246 34V47M1260 34V47M1246 47H1260M1253 60V77" stroke="#c40016" stroke-width="5"/>
<path d="M1278 34C1290 46 1290 59 1278 69V77" fill="none" stroke="#c40016" stroke-width="5"/>
<text x="1303" y="58" class="tr">저녁 맛집 추천</text>

<rect x="1244" y="110" width="312" height="535" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1400" y="160" text-anchor="middle" class="h">Albergue Gaucelmo</text>
<text x="1400" y="190" text-anchor="middle" class="h">(Rabanal del Camino)</text>
<line x1="1270" y1="220" x2="1530" y2="220" stroke="#efc8cd" stroke-width="2"/>
<text x="1272" y="275" class="check">✓</text><text x="1306" y="275" class="body">순례자 전용 메뉴 &amp; 푸짐한 저녁 식사</text>
<text x="1272" y="325" class="check">✓</text><text x="1306" y="325" class="body">수프, 고기 요리, 디저트, 와인 제공</text>
<text x="1272" y="375" class="check">✓</text><text x="1306" y="375" class="body">아늑한 분위기와 친절한 서비스</text>
<text x="1272" y="425" class="check">✓</text><text x="1306" y="425" class="body">숙소와 함께 저녁 해결 가능!</text>
<text x="1272" y="495" font-size="30">●</text><text x="1314" y="495" class="link">Google Maps</text>

<rect x="1244" y="675" width="312" height="265" rx="16" fill="#fffafb" stroke="#efcbd0"/>
<text x="1268" y="715" class="h" fill="#c40016">저녁 팁</text>
<text x="1268" y="755" class="body">• 다음 날 산악 구간을 대비해</text>
<text x="1268" y="785" class="body">  탄수화물과 단백질을 보충하세요.</text>
<text x="1268" y="835" class="body">• Rabanal에서는 일찍 쉬며</text>
<text x="1268" y="865" class="body">  충분한 수면을 취하는 것이 좋아요.</text>
</svg>