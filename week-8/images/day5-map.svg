<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
<style><![CDATA[
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e1ea;stroke-width:2}
.tb{fill:#1348a8;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tg{fill:#198038;font:700 29px Arial,"Noto Sans KR",sans-serif}
.to{fill:#e04d00;font:700 29px Arial,"Noto Sans KR",sans-serif}
.tr{fill:#c40016;font:700 29px Arial,"Noto Sans KR",sans-serif}
.sub{fill:#294b87;font:600 18px Arial,"Noto Sans KR",sans-serif}
.h{fill:#1f2733;font:700 22px Arial,"Noto Sans KR",sans-serif}
.body{fill:#26313f;font:19px Arial,"Noto Sans KR",sans-serif}
.small{fill:#52606d;font:17px Arial,"Noto Sans KR",sans-serif}
.link{fill:#1f5fe0;font:700 19px Arial,"Noto Sans KR",sans-serif}
.num{fill:#fff;font:700 22px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.check{fill:#111827;font:700 23px Arial,"Noto Sans KR",sans-serif}
]]></style>
</defs>

<rect class="bg" width="1600" height="1000"/>

<!-- COLUMN 1: SELLO -->
<rect class="card" x="20" y="20" width="380" height="960" rx="20"/>
<path d="M48 57C62 30 92 28 103 58C87 52 72 48 48 57Z" fill="#1348a8"/>
<path d="M75 35V64M63 38L70 64M87 39L80 64M53 45L66 67M97 45L84 67" stroke="#fff" stroke-width="3"/>
<text x="118" y="58" class="tb">Sello (도장) 장소 &amp; 순서</text>
<text x="118" y="88" class="sub">카미노 여권에 찍어야 할 도장 4곳</text>

<line x1="58" y1="138" x2="58" y2="785" stroke="#80a8ea" stroke-width="3" stroke-dasharray="6 10"/>

<circle cx="58" cy="145" r="22" fill="#1546a0"/><text x="58" y="145" class="num">1</text>
<text x="102" y="140" class="h">San Juan de Ortega 수도원</text>
<text x="102" y="174" class="sub">(중간 도장)</text>
<text x="102" y="208" class="body">11세기 수도원. Pilgrim Office에서</text>
<text x="102" y="236" class="body">도장 받기 가능.</text>

<circle cx="58" cy="335" r="22" fill="#1546a0"/><text x="58" y="335" class="num">2</text>
<text x="102" y="330" class="h">Burgos 대성당</text>
<text x="102" y="364" class="sub">(중간 도장)</text>
<text x="102" y="398" class="body">유네스코 세계유산! 대성당 내</text>
<text x="102" y="426" class="body">Pilgrim Office(우측)에서 도장.</text>

<circle cx="58" cy="525" r="22" fill="#1546a0"/><text x="58" y="525" class="num">3</text>
<text x="102" y="520" class="h">Hornillos del Camino</text>
<text x="102" y="554" class="sub">(중간 도장)</text>
<text x="102" y="588" class="body">마을의 Albergue 또는 바에서</text>
<text x="102" y="616" class="body">도장 받기 수월.</text>

<circle cx="58" cy="715" r="22" fill="#1546a0"/><text x="58" y="715" class="num">4</text>
<text x="102" y="710" class="h">Castrojeriz 알베르게/숙소</text>
<text x="102" y="744" class="sub">(도착 도장)</text>
<text x="102" y="778" class="body">숙소 도착 후 마지막 도장을</text>
<text x="102" y="806" class="body">받으세요.</text>

<rect x="44" y="850" width="332" height="90" rx="16" fill="#edf4ff" stroke="#c9daf7"/>
<text x="64" y="886" class="h" fill="#1348a8">Day 5 Sello 핵심</text>
<text x="64" y="920" class="small">중간 3곳 + 도착 1곳, 총 4곳.</text>

<!-- COLUMN 2: MUST SEE -->
<rect class="card" x="420" y="20" width="380" height="960" rx="20"/>
<circle cx="456" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<circle cx="482" cy="57" r="13" fill="none" stroke="#198038" stroke-width="6"/>
<rect x="465" y="41" width="9" height="16" rx="3" fill="#198038"/>
<text x="505" y="58" class="tg">오늘의 명소 (Must See)</text>

<rect x="444" y="110" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="150" class="h">San Juan de Ortega 수도원</text>
<text x="466" y="188" class="body">나무십자가와 아름다운 로마네스크</text>
<text x="466" y="218" class="body">회랑, 순례자들의 중요한 쉼터.</text>

<rect x="444" y="305" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="345" class="h">Burgos 대성당</text>
<text x="466" y="383" class="body">스페인 고딕 건축의 걸작.</text>
<text x="466" y="413" class="body">내부의 황금제단과 예배당, 스테인드</text>
<text x="466" y="443" class="body">글라스는 꼭 감상하세요!</text>

<rect x="444" y="500" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="540" class="h">부르고스 구시가지</text>
<text x="466" y="578" class="body">중세 성곽, 산타마리아 문,</text>
<text x="466" y="608" class="body">아를란손 강변 산책로가 매력적인</text>
<text x="466" y="638" class="body">아름다운 도시.</text>

<rect x="444" y="695" width="332" height="175" rx="16" fill="#f4fbf5" stroke="#cfe8d4"/>
<text x="466" y="735" class="h">Castrojeriz 성 &amp; 전망대</text>
<text x="466" y="773" class="body">언덕 위 중세 성과 메세타 평원의</text>
<text x="466" y="803" class="body">탁 트인 전망! 일몰 명소로도 유명.</text>

<rect x="444" y="890" width="332" height="50" rx="16" fill="#edf8ef" stroke="#cfe8d4"/>
<text x="466" y="922" class="small">San Juan → Burgos → 구시가지 → Castrojeriz</text>

<!-- COLUMN 3: LUNCH -->
<rect class="card" x="820" y="20" width="380" height="960" rx="20"/>
<path d="M853 34V60M846 34V47M860 34V47M846 47H860M853 60V77" stroke="#e04d00" stroke-width="5"/>
<path d="M878 34C890 46 890 59 878 69V77" fill="none" stroke="#e04d00" stroke-width="5"/>
<text x="905" y="58" class="to">점심 맛집 추천</text>

<rect x="844" y="110" width="332" height="535" rx="18" fill="#fff9f1" stroke="#f1c994" stroke-width="2"/>
<text x="1010" y="160" text-anchor="middle" class="h">La Fábrica Restaurante</text>
<text x="1010" y="190" text-anchor="middle" class="h">(Burgos)</text>
<line x1="872" y1="220" x2="1148" y2="220" stroke="#ead3b4" stroke-width="2"/>

<text x="874" y="275" class="check">✓</text><text x="908" y="275" class="body">부르고스 구시가지 인기 레스토랑</text>
<text x="874" y="325" class="check">✓</text><text x="908" y="325" class="body">현지 재료로 만든 창의적인 메뉴</text>
<text x="874" y="375" class="check">✓</text><text x="908" y="375" class="body">Pilgrim Menu (메뉴 델 디아) 제공</text>
<text x="874" y="425" class="check">✓</text><text x="908" y="425" class="body">자전거 주차 가능 (입구 앞)</text>

<text x="874" y="495" font-size="30">●</text>
<text x="916" y="495" class="link">Google Maps</text>

<text x="874" y="555" class="small">추천 시점</text>
<text x="874" y="588" class="body">Burgos 대성당과 구시가지를</text>
<text x="874" y="616" class="body">둘러본 뒤 점심과 충분한 휴식.</text>

<rect x="844" y="675" width="332" height="265" rx="16" fill="#fffdf9" stroke="#f1d8b7"/>
<text x="868" y="715" class="h" fill="#d85a00">점심 팁</text>
<text x="868" y="755" class="body">• 이후 Hornillos와 Castrojeriz까지</text>
<text x="868" y="785" class="body">  주행이 남아 있으므로 과식 금지.</text>
<text x="868" y="835" class="body">• 물과 전해질을 충분히 보충하고</text>
<text x="868" y="865" class="body">  출발하세요.</text>

<!-- COLUMN 4: DINNER -->
<rect class="card" x="1220" y="20" width="360" height="960" rx="20"/>
<path d="M1253 34V60M1246 34V47M1260 34V47M1246 47H1260M1253 60V77" stroke="#c40016" stroke-width="5"/>
<path d="M1278 34C1290 46 1290 59 1278 69V77" fill="none" stroke="#c40016" stroke-width="5"/>
<text x="1303" y="58" class="tr">저녁 맛집 추천</text>

<rect x="1244" y="110" width="312" height="535" rx="18" fill="#fff4f5" stroke="#f0b7be" stroke-width="2"/>
<text x="1400" y="160" text-anchor="middle" class="h">La Taberna (Castrojeriz)</text>
<line x1="1270" y1="220" x2="1530" y2="220" stroke="#efc8cd" stroke-width="2"/>

<text x="1272" y="275" class="check">✓</text><text x="1306" y="275" class="body">순례자들에게 인기 좋은 타베르나</text>
<text x="1272" y="325" class="check">✓</text><text x="1306" y="325" class="body">홈메이드 요리 &amp; 현지 와인</text>
<text x="1272" y="375" class="check">✓</text><text x="1306" y="375" class="body">친절한 서비스와 아늑한 분위기</text>
<text x="1272" y="425" class="check">✓</text><text x="1306" y="425" class="body">테라스에서 석양 감상 가능</text>

<text x="1272" y="495" font-size="30">●</text>
<text x="1314" y="495" class="link">Google Maps</text>

<text x="1272" y="555" class="small">추천 시점</text>
<text x="1272" y="588" class="body">Castrojeriz 도착 후 숙소 체크인과</text>
<text x="1272" y="616" class="body">휴식을 마친 뒤 저녁 식사.</text>

<rect x="1244" y="675" width="312" height="265" rx="16" fill="#fffafb" stroke="#efcbd0"/>
<text x="1268" y="715" class="h" fill="#c40016">저녁 팁</text>
<text x="1268" y="755" class="body">• 성과 전망대를 둘러본 뒤</text>
<text x="1268" y="785" class="body">  여유 있게 저녁을 즐기세요.</text>
<text x="1268" y="835" class="body">• 다음 날 메세타 구간을 위해</text>
<text x="1268" y="865" class="body">  충분히 먹고 일찍 쉬세요.</text>
</svg>