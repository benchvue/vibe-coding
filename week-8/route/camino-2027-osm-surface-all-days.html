<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camino Francés 2027 · OSM Surface · All Days</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#111214;--card:#1b1d20;--text:#f3f4f6;--muted:#b7bbc2;--border:#34373d}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
#map{height:100%;width:100%}
.panel{position:absolute;z-index:1000;left:12px;top:12px;width:min(560px,calc(100vw - 24px));background:rgba(20,21,24,.95);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:15px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.32)}
.fold{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
 padding:0 0 8px;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fold .ft{flex:1;min-width:0}
.fold .fi{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
 display:flex;align-items:center;justify-content:center;font-size:11px;color:#cbd5e1;
 transition:transform .2s}
.fold:hover .fi{background:rgba(255,255,255,.08)}
.panel.closed .fold{padding-bottom:0}
.panel.closed .fi{transform:rotate(180deg)}
.panel.closed .body{display:none}
.panel.closed .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{display:block}
.title{font-size:17px;font-weight:800;margin-bottom:2px}.sub{font-size:11px;color:var(--muted);margin-bottom:9px}
.days{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-bottom:9px}
.day{border:1px solid #444;background:#25272b;color:#eee;border-radius:7px;padding:7px 2px;font-size:11px;font-weight:700;cursor:pointer}
.day.active{background:#fff;color:#111}.day.rest{border-style:dashed}.day:hover{filter:brightness(1.12)}
.route{font-size:12px;font-weight:650;line-height:1.45;margin-bottom:6px}
.stats{font-size:11px;color:#d0d3d8;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11px;line-height:1.35}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.actions{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
button.action{border:0;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:750;background:#fff;color:#111;cursor:pointer}
button.action:disabled{opacity:.5}
.status{font-size:10.5px;color:#b9bdc5;line-height:1.4;margin-top:7px}
.summary{font-size:11px;line-height:1.5;margin-top:6px}
.restbox{padding:10px;border:1px dashed #666;border-radius:10px;font-size:12px;line-height:1.5;margin-top:8px}
.leaflet-popup-content{font-size:12px;line-height:1.45}
@media(max-width:650px){
 .panel{left:7px;right:7px;top:7px;width:auto;padding:10px}
 .days{grid-template-columns:repeat(7,1fr)}
 .title{font-size:15px}.legend{font-size:10px}
}
</style>
</head>

function metersPerDegLon(lat){return 111320*Math.cos(lat*Math.PI/180)}
function pointSegDistanceMeters(p,a,b){
 const sx=metersPerDegLon(p[0]),sy=110540,px=p[1]*sx,py=p[0]*sy,ax=a[1]*sx,ay=a[0]*sy,bx=b[1]*sx,by=b[0]*sy;
 const dx=bx-ax,dy=by-ay,den=dx*dx+dy*dy; let t=den===0?0:((px-ax)*dx+(py-ay)*dy)/den;
 t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function hav(a,b){
 const R=6371000,rad=Math.PI/180,p1=a[0]*rad,p2=b[0]*rad,dp=(b[0]-a[0])*rad,dl=(b[1]-a[1])*rad;
 const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function classify(t){
 const surface=(t.surface||"").toLowerCase(),smooth=(t.smoothness||"").toLowerCase(),track=(t.tracktype||"").toLowerCase();
 const mtb=parseInt((t["mtb:scale"]||"").split(";")[0],10);
 const difficult=new Set(["dirt","mud","sand","rock","rocks","stone","stones","earth","grass","clay"]);
 const rough=new Set(["gravel","pebblestone","unpaved","ground","crushed_stone"]);
 const compact=new Set(["compacted","fine_gravel"]);
 const paved=new Set(["asphalt","paved","concrete","concrete:plates","concrete:lanes","paving_stones","sett","cobblestone","metal","wood"]);
 if((!Number.isNaN(mtb)&&mtb>=1)||["very_bad","horrible","very_horrible","impassable"].includes(smooth)||["grade4","grade5"].includes(track)||difficult.has(surface))return"difficult";
 if(smooth==="bad"||track==="grade3"||rough.has(surface))return"rough";
 if(["grade1","grade2"].includes(track)||compact.has(surface))return"compact";
 if(paved.has(surface))return"paved";
 if(!surface&&!track&&["motorway","trunk","primary","secondary","tertiary","residential","living_street","service","unclassified"].includes(t.highway||""))return"paved";
 return"unknown";
}
function queryFor(info){
 return `[out:json][timeout:90];(\n${info.samples.map(p=>`way(around:45,${p[0].toFixed(6)},${p[1].toFixed(6)})["highway"];`).join("\n")}\n);out tags geom;`;
}
function nearest(p,ways){
 let best=null,bestD=Infinity;
 for(const w of ways){
  if(p[0]<w.minLat-.00075||p[0]>w.maxLat+.00075||p[1]<w.minLon-.0011||p[1]>w.maxLon+.0011)continue;
  const g=w.geometry;
  for(let j=1;j<g.length;j++){
   const d=pointSegDistanceMeters(p,[g[j-1].lat,g[j-1].lon],[g[j].lat,g[j].lon]);
   if(d<bestD){bestD=d;best=w}
  }
 }
 return bestD<=42?{way:best,dist:bestD}:null;
}
function popup(tags,k,dist){
 const label={paved:"🟢 Asphalt / Paved",compact:"🟡 Compact gravel",rough:"🟠 Gravel / Rough",difficult:"🔴 Dirt / Rocky / MTB difficult",unknown:"⚫ Unknown"}[k];
 return [["Class",label],["name",tags.name],["highway",tags.highway],["surface",tags.surface],["tracktype",tags.tracktype],["smoothness",tags.smoothness],["mtb:scale",tags["mtb:scale"]],["width",tags.width?tags.width+" m":null],["bicycle",tags.bicycle],["OSM match",dist!=null?dist.toFixed(1)+" m":null]]
 .filter(x=>x[1]!=null&&x[1]!=="").map(x=>`<b>${x[0]}:</b> ${x[1]}`).join("<br>");
}
async function analyze(){
 const info=DAYS[selected]; if(info.rest)return;
 const btn=document.getElementById("analyzeBtn"),status=document.getElementById("status"),summary=document.getElementById("summary");
 btn.disabled=true; status.textContent=`Day ${selected} OSM 도로/노면 태그 조회 중…`; summary.innerHTML="";
 coloredLayers.forEach(l=>map.removeLayer(l));coloredLayers=[];
 const eps=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
 let data=null,err=null;
 for(const ep of eps){
   try{
     const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(queryFor(info))});
     if(!r.ok)throw new Error("HTTP "+r.status); data=await r.json(); break;
   }catch(e){err=e}
 }
 if(!data){status.textContent="Overpass 조회 실패: "+(err?.message||"unknown error")+" · 잠시 후 다시 눌러주세요.";btn.disabled=false;return}
 const ways=(data.elements||[]).filter(e=>e.type==="way"&&e.geometry&&e.tags).map(w=>{
   const la=w.geometry.map(p=>p.lat),lo=w.geometry.map(p=>p.lon);
   w.minLat=Math.min(...la);w.maxLat=Math.max(...la);w.minLon=Math.min(...lo);w.maxLon=Math.max(...lo);return w;
 });
 status.textContent=`OSM way ${ways.length}개 수신 · GPX와 매칭 중…`;
 const totals={paved:0,compact:0,rough:0,difficult:0,unknown:0},segments=[]; let current=null;
 const P=info.points;
 for(let i=1;i<P.length;i++){
   const a=P[i-1],b=P[i],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],m=nearest(mid,ways),tags=m?.way?.tags||{},k=m?classify(tags):"unknown",len=hav(a,b),wid=m?.way?.id??null;
   totals[k]+=len;
   if(current&&current.k===k&&current.wid===wid){current.coords.push([b[0],b[1]]);current.len+=len}
   else{if(current)segments.push(current);current={k,wid,tags,dist:m?.dist??null,len,coords:[[a[0],a[1]],[b[0],b[1]]]}}
 }
 if(current)segments.push(current);
 if(baseLayer)baseLayer.setStyle({opacity:.18,weight:7});
 segments.forEach(s=>{const l=L.polyline(s.coords,{color:COLORS[s.k],weight:6,opacity:.96}).addTo(map);l.bindPopup(popup(s.tags,s.k,s.dist));coloredLayers.push(l)});
 const total=Object.values(totals).reduce((a,b)=>a+b,0);
 summary.innerHTML=[["🟢","paved"],["🟡","compact"],["🟠","rough"],["🔴","difficult"],["⚫","unknown"]]
   .map(([i,k])=>`${i} ${(totals[k]/1000).toFixed(1)} km (${total?(totals[k]/total*100).toFixed(0):0}%)`).join(" · ");
 status.textContent="완료 · 색상 경로를 누르면 OSM surface / tracktype / smoothness / width / bicycle 태그를 볼 수 있습니다.";
 btn.disabled=false;
 foldSub();
}
