name: 숙소 예약창 확인

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 확인
        id: run
        continue-on-error: true
        run: python week-8/watch/check.py

      - name: 결과 저장
        run: |
          git config user.name  "camino-watch"
          git config user.email "actions@github.com"
          git add week-8/watch/state.json week-8/watch/report.md week-8/watch/snap || true
          git diff --cached --quiet || git commit -m "숙소 확인 $(date +%F)"
          git push || true

      - name: 화면 갈무리 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: week-8/watch/snap/
          retention-days: 30
          if-no-files-found: ignore

      - name: 바뀌었으면 이슈로 알리기
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "숙소 예약창에 변화 — $(date +%F)" \
            --body-file week-8/watch/report.md
