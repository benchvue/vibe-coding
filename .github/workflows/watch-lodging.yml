« 이 파일은 저장소의 .github/workflows/watch-lodging.yml 로 넣으세요 »

name: 숙소 예약창 확인

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:        # 버튼으로 직접 돌릴 수도 있습니다

permissions:
  contents: write           # state.json 을 저장소에 다시 저장
  issues: write             # 바뀌면 이슈로 알림

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 확인
        id: run
        continue-on-error: true
        run: python week-8/watch/check.py 

      - name: 결과 저장
        run: |
          git config user.name  "camino-watch"
          git config user.email "actions@github.com"
          git add watch/state.json watch/report.md watch/snap 2>/dev/null || true
          git diff --cached --quiet || git commit -m "숙소 확인 $(date +%F)"
          git push || true

      - name: 화면 갈무리 보관
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: watch/snap/
          retention-days: 30

      - name: 바뀌었으면 이슈로 알리기
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "숙소 예약창에 변화 — $(date +%F)" \
            --body-file week-8/watch/report.md \
            --label "숙소" || \
          gh issue create \
            --title "숙소 예약창에 변화 — $(date +%F)" \
            --body-file week-8/watch/report.md
